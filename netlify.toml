[build]
  command = "bun run build"
  publish = "out"

[build.environment]
  BUN_VERSION = "latest"
  NODE_VERSION = "20"

[[redirects]]
  from = "/.netlify/scripts/hud*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.netlify/scripts/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/map/img/:file"
  to = "/map/img/t/:file"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
